<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Elite Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">EliteStore</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

    <!-- Shop Header -->
    <section class="featured">
        <h2>Our Products</h2>

        <!-- Search -->
        <div class="search-box">
            <input type="text" placeholder="Search products...">
            <button><i class="fas fa-search"></i></button>
        </div>

        <!-- Filters -->
        <div class="filters">
            <button>All</button>
            <button>Electronics</button>
            <button>Fashion</button>
            <button>Gaming</button>
            <button>Accessories</button>
        </div>

        <!-- Product Grid -->
        <div class="product-grid">

            <div class="product-card">
                <i class="fas fa-heart wishlist"></i>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="">
                <h3>Gaming Headset</h3>
                <p>₹3499</p>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <button>Add to Cart</button>
                <button onclick="location.href='product.html'">Buy Now</button>
            </div>

            <div class="product-card">
                <i class="fas fa-heart wishlist"></i>
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="">
                <h3>Premium Shoes</h3>
                <p>₹2999</p>
                <div class="rating">⭐⭐⭐⭐</div>
                <button>Add to Cart</button>
                <button onclick="location.href='product.html'">Buy Now</button>
            </div>

            <div class="product-card">
                <i class="fas fa-heart wishlist"></i>
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="">
                <h3>Luxury Watch</h3>
                <p>₹4999</p>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <button>Add to Cart</button>
                <button onclick="location.href='product.html'">Buy Now</button>
            </div>

            <div class="product-card">
                <i class="fas fa-heart wishlist"></i>
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="">
                <h3>Smartphone</h3>
                <p>₹24999</p>
                <div class="rating">⭐⭐⭐⭐⭐</div>
                <button>Add to Cart</button>
                <button onclick="location.href='product.html'">Buy Now</button>
            </div>

        </div>
    </section>

</body>
</html>
